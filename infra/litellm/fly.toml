app = "relic-llm-dev"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

[[http_service.checks]]
  grace_period = "45s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health/liveliness"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
